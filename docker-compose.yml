version: "3.9"

services:
  notification-service:
    container_name: notification-service
    image: qb1tycinema/notification-service:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env.production.local
    expose:
      - "9103"
    volumes:
      - ../docker/logs/notification:/var/log/services/notification
    networks:
      - qb1tycinema

networks:
  qb1tycinema:
    external: true